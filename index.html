<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPaste | Elite Script Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-base: #060813;
            --bg-surface: #0b0e22;
            --bg-card: rgba(18, 22, 51, 0.7);
            --border-color: rgba(99, 102, 241, 0.2);
            --border-glow: rgba(139, 92, 246, 0.4);
            --accent-indigo: #6366f1;
            --accent-violet: #8b5cf6;
            --accent-cyan: #06b6d4;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #6366f1 50%, #8b5cf6 100%);
            --radius-md: 12px;
            --radius-lg: 18px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Auth Screen */
        .auth-overlay {
            position: fixed; inset: 0; background: rgba(6, 8, 19, 0.9);
            backdrop-filter: blur(16px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .auth-box {
            background: var(--bg-surface); border: 1px solid var(--border-glow); border-radius: var(--radius-lg);
            padding: 36px; width: 100%; max-width: 400px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px rgba(99, 102, 241, 0.2);
        }
        .auth-icon {
            width: 60px; height: 60px; background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
            color: var(--accent-indigo); font-size: 24px;
        }
        .auth-box h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: #fff; }
        .auth-box p { font-size: 12px; color: var(--text-secondary); margin-bottom: 24px; }

        /* Header */
        header {
            background: rgba(11, 14, 34, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color);
            padding: 16px 32px; display: flex; justify-content: space-between; align-items: center;
        }
        .brand { font-weight: 800; font-size: 18px; color: #fff; display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .brand-icon {
            width: 36px; height: 36px; background: var(--gradient-primary); border-radius: 8px;
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px;
        }
        .status-badge {
            font-size: 11px; font-weight: 600; color: #34d399; background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2); padding: 6px 12px; border-radius: 20px;
            display: flex; align-items: center; gap: 6px;
        }
        .status-dot { width: 6px; height: 6px; background: #34d399; border-radius: 50%; box-shadow: 0 0 6px #34d399; }

        /* Main Container */
        main { flex: 1; max-width: 950px; width: 100%; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }

        .card {
            background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .card-title {
            font-size: 13px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;
            letter-spacing: 0.8px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }
        .card-title i { color: var(--accent-indigo); }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
        @media(max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

        .input-ctrl {
            width: 100%; background: #070914; border: 1px solid var(--border-color); border-radius: var(--radius-md);
            padding: 12px 16px; color: #fff; font-size: 13px; outline: none; transition: 0.2s;
        }
        .input-ctrl:focus { border-color: var(--accent-indigo); box-shadow: 0 0 12px rgba(99, 102, 241, 0.25); }

        textarea.code-area {
            width: 100%; height: 220px; background: #070914; border: 1px solid var(--border-color); border-radius: var(--radius-md);
            padding: 14px; color: #e5e7eb; font-family: 'Fira Code', monospace; font-size: 12px; resize: vertical; outline: none;
        }
        textarea.code-area::placeholder { color: var(--text-muted); }

        .control-row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; flex-wrap: wrap; gap: 12px; }

        .checkbox-wrapper { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-primary); }
        .checkbox-wrapper input { width: 16px; height: 16px; accent-color: var(--accent-indigo); cursor: pointer; }

        .btn {
            background: var(--gradient-primary); color: #fff; border: none; border-radius: var(--radius-md);
            padding: 12px 24px; font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s;
            display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4); }

        .btn-sm { padding: 8px 14px; font-size: 11px; font-weight: 600; box-shadow: none; }

        /* Results Box */
        .result-box { display: none; margin-top: 16px; background: #070914; border: 1px solid var(--border-glow); border-radius: var(--radius-md); padding: 16px; }
        .result-group { margin-bottom: 12px; }
        .result-group:last-child { margin-bottom: 0; }
        .result-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; display: block; text-transform: uppercase; }
        
        .code-row { display: flex; gap: 8px; align-items: center; }
        .code-display {
            flex: 1; background: var(--bg-surface); border: 1px solid var(--border-color); padding: 10px 14px;
            border-radius: 8px; font-family: 'Fira Code', monospace; font-size: 12px; color: var(--accent-cyan);
            overflow-x: auto; white-space: nowrap;
        }

        /* Community Feed */
        .script-list { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; padding-right: 4px; }
        .script-item {
            background: #070914; border: 1px solid var(--border-color); border-radius: var(--radius-md);
            padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
            transition: 0.2s;
        }
        .script-item:hover { border-color: rgba(99, 102, 241, 0.4); background: rgba(11, 14, 34, 0.9); }
        .script-meta h4 { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 2px; }
        .script-meta span { font-size: 11px; color: var(--text-secondary); }

        /* Toast Notification */
        .toast {
            position: fixed; bottom: 24px; right: 24px; background: var(--bg-surface); border: 1px solid var(--accent-indigo);
            color: #fff; padding: 12px 20px; border-radius: var(--radius-md); font-size: 12px; font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateY(100px); opacity: 0; transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2000; display: flex; align-items: center; gap: 8px;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <!-- Auth Protection -->
    <div class="auth-overlay" id="authScreen">
        <div class="auth-box">
            <div class="auth-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <h2>Secure Access</h2>
            <p>Enter the master password to access the execution suite.</p>
            <form onsubmit="handleAuth(event)">
                <input type="password" id="passkeyInput" class="input-ctrl" placeholder="Passkey..." required autocomplete="off" style="margin-bottom: 14px; text-align: center;">
                <button type="submit" class="btn" style="width: 100%; justify-content: center;">Authenticate</button>
            </form>
        </div>
    </div>

    <!-- Header -->
    <header>
        <a href="#" class="brand">
            <div class="brand-icon"><i class="fa-solid fa-code"></i></div>
            CyberPaste
        </a>
        <div class="status-badge">
            <span class="status-dot"></span> Delta Ready
        </div>
    </header>

    <!-- Main Workspace -->
    <main>
        <!-- Publisher Panel -->
        <div class="card">
            <div class="card-title"><i class="fa-solid fa-pen-nib"></i> Publish New Script</div>
            
            <div class="form-grid">
                <input type="text" id="authorInput" class="input-ctrl" placeholder="Author Name (e.g. YH)" required>
                <input type="text" id="scriptNameInput" class="input-ctrl" placeholder="Script Name (e.g. Combat V2)" required>
            </div>

            <textarea id="scriptInput" class="code-area" placeholder="-- Paste your Lua code here..." spellcheck="false"></textarea>

            <div class="control-row">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="obfuscateToggle" checked>
                    <span>Enable Obfuscation (Strong)</span>
                </label>
                <button class="btn" onclick="publishScript()">
                    <i class="fa-solid fa-paper-plane"></i> Publish Script
                </button>
            </div>

            <!-- Result Box -->
            <div class="result-box" id="resultBox">
                <div class="result-group">
                    <span class="result-label">1. Delta Loadstring:</span>
                    <div class="code-row">
                        <div class="code-display" id="loadstringDisplay"></div>
                        <button class="btn btn-sm" onclick="copyText('loadstringDisplay', 'Loadstring copied!')"><i class="fa-regular fa-copy"></i> Copy</button>
                    </div>
                </div>
                <div class="result-group" style="margin-top: 10px;">
                    <span class="result-label">2. Raw Endpoint Link:</span>
                    <div class="code-row">
                        <div class="code-display" id="rawUrlDisplay"></div>
                        <button class="btn btn-sm" onclick="copyText('rawUrlDisplay', 'Raw link copied!')"><i class="fa-regular fa-copy"></i> Copy</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Community Feed -->
        <div class="card">
            <div class="card-title"><i class="fa-solid fa-globe"></i> Published Scripts Hub</div>
            <div class="script-list" id="scriptListContainer">
                <span style="font-size: 12px; color: var(--text-muted);">No scripts published in this session.</span>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div class="toast" id="toast"><i class="fa-solid fa-circle-check" style="color: #34d399;"></i> <span id="toastMsg">Success</span></div>

    <script>
        const PASSKEY = "123YHTYH";

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('cyber_auth') === 'true') {
                document.getElementById('authScreen').style.display = 'none';
            }
            handleRawRoute();
            renderScriptList();
        });

        function handleAuth(e) {
            e.preventDefault();
            const val = document.getElementById('passkeyInput').value;
            if (val === PASSKEY) {
                sessionStorage.setItem('cyber_auth', 'true');
                document.getElementById('authScreen').style.display = 'none';
                showToast("Access Granted!");
            } else {
                showToast("Incorrect Password!");
                document.getElementById('passkeyInput').value = '';
            }
        }

        // Generate strict 6-character random ID (e.g. a7x9k2)
        function generateShortId() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let res = '';
            for (let i = 0; i < 6; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return res;
        }

        function obfuscateLua(code) {
            const key = Math.floor(Math.random() * 200) + 20;
            let bytes = [];
            for (let i = 0; i < code.length; i++) { bytes.push(code.charCodeAt(i) ^ key); }
            return `-- Obfuscated by CyberPaste\local _k = ${key}\local _b = {${bytes.join(',')}}\local _s = ""\for i = 1, #_b do _s = _s .. string.char(bit32 and bit32.bxor(_b[i], _k) or (_b[i] ~ _k)) end\local f = loadstring(_s)\return f and f()`;
        }

        function publishScript() {
            const author = document.getElementById('authorInput').value.trim();
            const scriptName = document.getElementById('scriptNameInput').value.trim();
            const code = document.getElementById('scriptInput').value.trim();

            if (!author || !scriptName || !code) {
                showToast("Please fill all fields!");
                return;
            }

            const shouldObf = document.getElementById('obfuscateToggle').checked;
            const finalCode = shouldObf ? obfuscateLua(code) : code;

            const shortId = generateShortId();
            const payload = btoa(encodeURIComponent(finalCode));

            let saved = JSON.parse(localStorage.getItem('cyber_hub_scripts') || '[]');
            saved.unshift({ id: shortId, author, scriptName, payload });
            localStorage.setItem('cyber_hub_scripts', JSON.stringify(saved));

            const baseUrl = window.location.href.split('#')[0].split('?')[0];
            const rawUrl = `${baseUrl}?id=${shortId}`;
            const loadstringCmd = `loadstring(game:HttpGet("${rawUrl}"))()`;

            document.getElementById('loadstringDisplay').innerText = loadstringCmd;
            document.getElementById('rawUrlDisplay').innerText = rawUrl;
            document.getElementById('resultBox').style.display = 'block';

            renderScriptList();
            showToast("Script published successfully!");
        }

        function renderScriptList() {
            const container = document.getElementById('scriptListContainer');
            const saved = JSON.parse(localStorage.getItem('cyber_hub_scripts') || '[]');

            if (saved.length === 0) {
                container.innerHTML = `<span style="font-size: 12px; color: var(--text-muted);">No scripts published in this session.</span>`;
                return;
            }

            container.innerHTML = '';
            saved.forEach(s => {
                const baseUrl = window.location.href.split('#')[0].split('?')[0];
                const rawUrl = `${baseUrl}?id=${s.id}`;
                const loadstringCmd = `loadstring(game:HttpGet("${rawUrl}"))()`;

                const item = document.createElement('div');
                item.className = 'script-item';
                item.innerHTML = `
                    <div class="script-meta">
                        <h4>${escapeHtml(s.scriptName)}</h4>
                        <span>By ${escapeHtml(s.author)} • ID: <code>${s.id}</code></span>
                    </div>
                    <button class="btn btn-sm" onclick="copyDirect('${escapeHtml(loadstringCmd)}')"><i class="fa-regular fa-copy"></i> Copy Loadstring</button>
                `;
                container.appendChild(item);
            });
        }

        function handleRawRoute() {
            const urlParams = new URLSearchParams(window.location.search);
            const scriptId = urlParams.get('id');

            if (scriptId) {
                const saved = JSON.parse(localStorage.getItem('cyber_hub_scripts') || '[]');
                const found = saved.find(s => s.id === scriptId);
                if (found) {
                    try {
                        const decoded = decodeURIComponent(atob(found.payload));
                        document.open();
                        document.write(decoded);
                        document.close();
                        return;
                    } catch(e) {}
                }
                document.body.innerText = "-- Error: Script not found or removed.";
            }
        }

        function copyText(elemId, msg) {
            const text = document.getElementById(elemId).innerText;
            navigator.clipboard.writeText(text).then(() => showToast(msg));
        }

        function copyDirect(text) {
            navigator.clipboard.writeText(text).then(() => showToast("Loadstring copied!"));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
